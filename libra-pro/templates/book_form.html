{% extends "base.html" %}
{% block title %}{{ 'Edit' if book else 'Add' }} Book - LibraPro{% endblock %}
{% block content %}
<div class="max-w-2xl"><h1 class="text-3xl font-bold gradient-text mb-6">{{ 'Edit Book' if book else 'Add New Book' }}</h1><form method="POST" class="glass rounded-2xl p-8 space-y-5"><div class="grid grid-cols-2 gap-5"><div class="col-span-2"><label class="block text-sm text-slate-300 mb-2">Title *</label><input type="text" name="title" value="{{ book.title if book else '' }}" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div><label class="block text-sm text-slate-300 mb-2">Author *</label><input type="text" name="author" value="{{ book.author if book else '' }}" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div><label class="block text-sm text-slate-300 mb-2">ISBN</label><input type="text" name="isbn" value="{{ book.isbn if book else '' }}" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div><label class="block text-sm text-slate-300 mb-2">Category</label><input type="text" name="category" value="{{ book.category if book else '' }}" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div><label class="block text-sm text-slate-300 mb-2">Publisher</label><input type="text" name="publisher" value="{{ book.publisher if book else '' }}" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div><label class="block text-sm text-slate-300 mb-2">Year</label><input type="number" name="year" value="{{ book.year if book else '' }}" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div><label class="block text-sm text-slate-300 mb-2">Copies</label><input type="number" name="copies" value="{{ book.copies if book else 1 }}" min="1" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div class="col-span-2"><label class="block text-sm text-slate-300 mb-2">Description</label><textarea name="description" rows="3" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl">{{ book.description if book else '' }}</textarea></div></div><div class="flex gap-4 pt-4"><button type="submit" class="px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl font-semibold">Save Book</button><a href="{{ url_for('books') }}" class="px-8 py-3 border border-slate-600 rounded-xl">Cancel</a></div></form></div>
{% endblock %}
