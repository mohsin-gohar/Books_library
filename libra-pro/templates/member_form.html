{% extends "base.html" %}
{% block title %}Add Member - LibraPro{% endblock %}
{% block content %}
<div class="max-w-xl"><h1 class="text-3xl font-bold gradient-text mb-6">Add New Member</h1><form method="POST" class="glass rounded-2xl p-8 space-y-5"><div><label class="block text-sm text-slate-300 mb-2">Full Name *</label><input type="text" name="name" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div><label class="block text-sm text-slate-300 mb-2">Email *</label><input type="email" name="email" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div><label class="block text-sm text-slate-300 mb-2">Phone</label><input type="text" name="phone" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div><div><label class="block text-sm text-slate-300 mb-2">Membership Type</label><select name="membership_type" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"><option value="standard">Standard</option><option value="premium">Premium</option></select></div><div class="flex gap-4 pt-4"><button type="submit" class="px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl font-semibold">Add Member</button><a href="{{ url_for('members') }}" class="px-8 py-3 border border-slate-600 rounded-xl">Cancel</a></div></form></div>
{% endblock %}
