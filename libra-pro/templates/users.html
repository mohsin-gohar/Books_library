{% extends "base.html" %}
{% block title %}Users - LibraPro{% endblock %}
{% block content %}
<div class="mb-8"><h1 class="text-4xl font-bold gradient-text">User Management</h1><p class="text-slate-400">Create librarian accounts</p></div>
<div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
    <div class="glass rounded-2xl p-6"><h2 class="text-xl font-semibold mb-4">Add User</h2><form method="POST" action="{{ url_for('add_user') }}" class="space-y-4"><input type="text" name="username" required placeholder="Username" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"><input type="email" name="email" required placeholder="Email" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"><input type="password" name="password" required placeholder="Password" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"><select name="role" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"><option value="librarian">Librarian</option><option value="admin">Admin</option></select><button type="submit" class="w-full py-3 bg-indigo-600 rounded-xl">Create User</button></form></div>
    <div class="glass rounded-2xl overflow-hidden"><table class="w-full"><thead class="bg-slate-800/50"><tr><th class="px-6 py-4 text-left">Username</th><th class="px-6 py-4 text-left">Role</th><th class="px-6 py-4 text-left">Email</th></tr></thead><tbody class="divide-y divide-slate-700/50">{% for u in users %}<tr><td class="px-6 py-4">{{ u.username }}</td><td class="px-6 py-4 capitalize">{{ u.role }}</td><td class="px-6 py-4">{{ u.email }}</td></tr>{% endfor %}</tbody></table></div>
</div>
{% endblock %}
