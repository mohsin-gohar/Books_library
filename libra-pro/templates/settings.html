{% extends "base.html" %}
{% block title %}Settings - LibraPro{% endblock %}
{% block content %}
<div class="max-w-xl"><h1 class="text-4xl font-bold gradient-text mb-8">Library Settings</h1>
<form method="POST" class="glass rounded-2xl p-8 space-y-5">
    <div><label class="block text-sm text-slate-300 mb-2">Library Name</label><input type="text" name="library_name" value="{{ settings.library_name }}" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div>
    <div><label class="block text-sm text-slate-300 mb-2">Default Loan Days</label><input type="number" name="default_loan_days" value="{{ settings.default_loan_days }}" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div>
    <div><label class="block text-sm text-slate-300 mb-2">Fine Per Day</label><input type="number" step="0.1" name="fine_per_day" value="{{ settings.fine_per_day }}" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div>
    <div><label class="block text-sm text-slate-300 mb-2">Max Books Per Member</label><input type="number" name="max_books_per_member" value="{{ settings.max_books_per_member }}" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl"></div>
    <button type="submit" class="px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl font-semibold">Save Settings</button>
</form></div>
{% endblock %}
