{% extends "base.html" %}
{% block title %}Login - LibraPro{% endblock %}
{% block auth_content %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900">
    <div class="glass p-10 rounded-3xl w-full max-w-md shadow-2xl border border-white/10">
        <div class="text-center mb-8">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-indigo-500 flex items-center justify-center mb-4">
                <i class="fas fa-book-open text-3xl text-white"></i>
            </div>
            <h1 class="text-3xl font-bold gradient-text">LibraPro</h1>
            <p class="text-slate-400 mt-2">Premium Library Management</p>
        </div>
        <form method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:border-indigo-500 text-white" placeholder="admin">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl focus:outline-none focus:border-indigo-500 text-white" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-semibold rounded-xl transition shadow-lg shadow-indigo-500/25">
                Sign In
            </button>
        </form>
        <p class="text-center text-xs text-slate-500 mt-6">Default: admin / admin123</p>
    </div>
</div>
{% endblock %}
